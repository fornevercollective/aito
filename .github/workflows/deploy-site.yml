name: Deploy Astro Test Site

# IMPORTANT: For this workflow to be the source of truth for GitHub Pages (and to
# avoid the legacy Jekyll processor running on our source tree and choking on
# .astro frontmatter like ---import ...--- ), go to the repo Settings → Pages and
# set "Source" under "Build and deployment" to "GitHub Actions".
#
# We also commit a root `.nojekyll` and ensure one is in the artifact as defense-in-depth.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (22.14+ required by site/ workspace)
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: 'npm'

      - name: Verify Node version (enforce engine requirements)
        run: |
          node -e '
            const [major, minor] = process.version.replace("v", "").split(".").map(Number);
            const requiredMajor = 22;
            const requiredMinor = 14;
            if (major < requiredMajor || (major === requiredMajor && minor < requiredMinor)) {
              console.error(`❌ Node >= ${requiredMajor}.${requiredMinor} is required.`);
              console.error(`   Current: ${process.version}`);
              console.error("   Reason: The Astro site in /site requires Node 22.14+ (see site/package.json engines).");
              console.error("   Please use a recent Node 22 LTS version locally and in CI.");
              process.exit(1);
            }
            console.log(`✅ Node version OK: ${process.version}`);
          '

      - name: Install all dependencies (root + workspaces)
        run: npm ci

      # 1. Build the main aito editor as the primary experience at /aito/
      - name: Build main aito editor (primary live product at /aito/)
        env:
          VITE_BASE: /aito/
        run: |
          npm run build

      # 2. Build the Astro marketing site (hub + brand + pricing + license + versions/*).
      # We do the selective copy in the next step so we can place pages at the
      # correct /aito/* paths without clobbering the Vite editor's index.html at root.
      - name: Build Astro marketing site (hub, brand, pricing, versions, etc.)
        run: |
          cd site
          npm run build

      # Place the Astro marketing pages (brand, pricing, license, versions/*, hub/) at the
      # correct top-level paths under /aito/. Selectively copy subdirectories only, to avoid
      # clobbering the main Vite editor's dist/index.html (the live product at /aito/).
      # The preceding "Build Astro marketing site" step produced the files with the proper
      # default base so that links and BASE_URL resolve to /aito/* .
      - name: Place top-level Astro marketing pages (brand, pricing, versions, license, hub)
        run: |
          cd site
          cp -r dist/brand ../dist/ 2>/dev/null || true
          cp -r dist/pricing ../dist/ 2>/dev/null || true
          cp -r dist/license ../dist/ 2>/dev/null || true
          cp -r dist/versions ../dist/ 2>/dev/null || true
          cp -r dist/hub ../dist/ 2>/dev/null || true
          # Static assets at site root (favicons, logo) if not provided by editor build
          cp -n dist/favicon.* ../dist/ 2>/dev/null || true
          cp -n dist/logo.svg ../dist/ 2>/dev/null || true

      # Future iterations can add similar steps, e.g.
      # - name: Build living-canvas preview (when ready)
      #   ...

      # Ensure .nojekyll is present in the published artifact so that if GitHub's
      # legacy Pages/Jekyll processor ever inspects the output, it won't try to
      # parse our static HTML (or any leftover files) as Jekyll content with YAML.
      # The root .nojekyll in the repo also suppresses processing of source files
      # like site/src/**/*.astro that contain Astro frontmatter (--- ... ---).
      - name: Add .nojekyll to published site root
        run: |
          touch dist/.nojekyll
          # Also for the hub subdir in case it is accessed directly
          touch dist/hub/.nojekyll 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
