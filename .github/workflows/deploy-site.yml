name: Deploy Astro Test Site

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (22.14+ required by site/ workspace)
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: 'npm'

      - name: Verify Node version (enforce engine requirements)
        run: |
          node -e '
            const [major, minor] = process.version.replace("v", "").split(".").map(Number);
            const requiredMajor = 22;
            const requiredMinor = 14;
            if (major < requiredMajor || (major === requiredMajor && minor < requiredMinor)) {
              console.error(`❌ Node >= ${requiredMajor}.${requiredMinor} is required.`);
              console.error(`   Current: ${process.version}`);
              console.error("   Reason: The Astro site in /site requires Node 22.14+ (see site/package.json engines).");
              console.error("   Please use a recent Node 22 LTS version locally and in CI.");
              process.exit(1);
            }
            console.log(`✅ Node version OK: ${process.version}`);
          '

      - name: Install all dependencies (root + workspaces)
        run: npm ci

      # 1. Build the Astro umbrella hub first — this will be the root/start page at /aito/
      - name: Build Astro hub (start page + versions/iterations)
        run: |
          cd site
          npm run build

      # 2. Build the main aito editor and place it under /versions/main/ (not the landing yet)
      - name: Build main aito editor (for /aito/versions/main/)
        env:
          VITE_BASE: /aito/versions/main/
        run: |
          npm run build
          mkdir -p site/dist/versions/main
          cp -r dist/* site/dist/versions/main/

      # Future iterations can add similar steps, e.g.
      # - name: Build living-canvas preview (when ready)
      #   ...

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
