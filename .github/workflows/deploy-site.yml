name: Deploy Astro Test Site

# IMPORTANT: For this workflow to be the source of truth for GitHub Pages (and to
# avoid the legacy Jekyll processor running on our source tree and choking on
# .astro frontmatter like ---import ...--- ), go to the repo Settings → Pages and
# set "Source" under "Build and deployment" to "GitHub Actions".
#
# We also commit a root `.nojekyll` and ensure one is in the artifact as defense-in-depth.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deploy at a time; cancel older pushes so main+master don't race
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (22.14+ required by site/ workspace)
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: 'npm'

      - name: Verify Node version (enforce engine requirements)
        run: |
          node -e '
            const [major, minor] = process.version.replace("v", "").split(".").map(Number);
            const requiredMajor = 22;
            const requiredMinor = 14;
            if (major < requiredMajor || (major === requiredMajor && minor < requiredMinor)) {
              console.error(`❌ Node >= ${requiredMajor}.${requiredMinor} is required.`);
              console.error(`   Current: ${process.version}`);
              console.error("   Reason: The Astro site in /site requires Node 22.14+ (see site/package.json engines).");
              console.error("   Please use a recent Node 22 LTS version locally and in CI.");
              process.exit(1);
            }
            console.log(`✅ Node version OK: ${process.version}`);
          '

      - name: Install all dependencies (root + workspaces)
        run: npm ci

      # 1. Build the main aito editor as the primary experience at /aito/
      - name: Build main aito editor (primary live product at /aito/)
        env:
          VITE_BASE: /aito/
        run: |
          npm run build

      # 2. Build the Astro marketing site (hub + brand + pricing + license + versions/*).
      # We do the selective copy in the next step so we can place pages at the
      # correct /aito/* paths without clobbering the Vite editor's index.html at root.
      - name: Build Astro marketing site (hub, brand, pricing, versions, etc.)
        run: |
          cd site
          npm run build

      # Place Astro marketing pages under /aito/* without clobbering the Vite editor index.
      - name: Place top-level Astro marketing pages (brand, pricing, versions, license, hub, spatial)
        run: |
          set -e
          cd site
          for dir in brand pricing license versions hub spatial; do
            if [ -d "dist/$dir" ]; then
              rm -rf "../dist/$dir"
              cp -r "dist/$dir" ../dist/
            fi
          done
          # Static assets at site root (favicons, logo) if not provided by editor build
          cp -n dist/favicon.* ../dist/ 2>/dev/null || true
          cp -n dist/logo.svg ../dist/ 2>/dev/null || true

      # Publish gsplat booth static UI at /aito/spatial/booth/ (relative imports; CDN three/MediaPipe).
      # Local-only APIs (/api/media, ZipDepth, JAX) still need ./Launch-Spatial.command.
      - name: Publish spatial gsplat booth under /aito/spatial/booth/
        run: |
          set -e
          mkdir -p dist/spatial/booth
          # Booth modules only — no absolute music symlink, no binaries
          rsync -a \
            --exclude '.DS_Store' \
            --exclude '*.map' \
            spatial/booth/ dist/spatial/booth/
          # Ensure directory indexes work on Pages
          touch dist/spatial/.nojekyll
          touch dist/spatial/booth/.nojekyll
          # wasm next to booth so ../wasm/booth_modulator.wasm resolves
          if [ -f spatial/wasm/booth_modulator.wasm ]; then
            mkdir -p dist/spatial/wasm dist/wasm
            cp -f spatial/wasm/booth_modulator.wasm dist/spatial/wasm/booth_modulator.wasm
            cp -f spatial/wasm/booth_modulator.wasm dist/wasm/booth_modulator.wasm
          fi
          ls -la dist/spatial/booth | head -20
          test -f dist/spatial/booth/index.html
          test -f dist/spatial/booth/gsplat-booth.js

      - name: Add .nojekyll to published site root
        run: |
          touch dist/.nojekyll
          touch dist/hub/.nojekyll 2>/dev/null || true
          touch dist/spatial/.nojekyll 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
