name: Deploy Astro Test Site

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (22.14+ required by site/ workspace)
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: 'npm'

      - name: Verify Node version (enforce engine requirements)
        run: |
          node -e '
            const [major, minor] = process.version.replace("v", "").split(".").map(Number);
            const requiredMajor = 22;
            const requiredMinor = 14;
            if (major < requiredMajor || (major === requiredMajor && minor < requiredMinor)) {
              console.error(`❌ Node >= ${requiredMajor}.${requiredMinor} is required.`);
              console.error(`   Current: ${process.version}`);
              console.error("   Reason: The Astro site in /site requires Node 22.14+ (see site/package.json engines).");
              console.error("   Please use a recent Node 22 LTS version locally and in CI.");
              process.exit(1);
            }
            console.log(`✅ Node version OK: ${process.version}`);
          '

      - name: Install all dependencies (root + workspaces)
        run: npm ci

      # Build the main editor first into a temp location
      - name: Build main aito editor (primary live experience, like vwall)
        env:
          VITE_BASE: /aito/
        run: |
          npm run build

      # Build Astro hub (uses already-installed deps from root npm ci)
      - name: Build Astro hub (iterations + living-canvas pages)
        run: |
          cd site
          npm run build
          # Merge Astro output into the main dist so the final Pages artifact has everything
          cp -r dist/* ../dist/ 2>/dev/null || true

      # Future iterations can add similar steps, e.g.
      # - name: Build living-canvas preview (when ready)
      #   ...

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
