name: Deploy Astro Test Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      # Build the main editor first into a temp location
      - name: Build main aito editor (primary live experience, like vwall)
        env:
          VITE_BASE: /aito/
        run: |
          npm run build

      # Build Astro hub for additional pages (iterations docs, living-canvas vision)
      # These get merged so the main editor remains the primary experience at root
      - name: Build Astro hub (iterations + living-canvas pages)
        run: |
          cd site
          npm ci
          npm run build
          # Merge Astro output (pages like /iterations, /versions/living-canvas) into the main dist
          cp -r dist/* ../dist/ 2>/dev/null || true

      # Future iterations can add similar steps, e.g.
      # - name: Build living-canvas preview (when ready)
      #   ...

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
