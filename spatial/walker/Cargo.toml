[package]
name = "aito-walker"
version = "0.1.0"
edition = "2021"
description = "tree-sitter walker for booth shell + lua preset scripts"

[[bin]]
name = "aito-walk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
tree-sitter-lua = "0.2"

[profile.release]
opt-level = 2
lto = true
strip = true